<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Route Explorer</title>
<meta name="description" content="Pick a course and see every prerequisite on the route to it, and what it unlocks. Built from a curriculum knowledge graph.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f8f9fc;
    --line: #eceef4;
    --ink: #2b2d42;
    --muted: #8d90a6;
    --accent: #6c8ae4;
    /* one soft color per track; chips use a pastel tint of it */
    --l-cs: #7c9ce8;
    --l-math: #ef9a8a;
    --l-sci: #7fc8a0;
    --l-gened: #e3c27a;
    --l-elec: #a99be0;
    --l-minor: #b4bcc6;
    --l-ai: #ee9cc4;
    --l-bda: #7cc9c9;
    --l-se: #f2b880;
    --l-csys: #a7c78a;
    --l-acs: #b49ad6;
    --l-ext: #cfd5dc;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { padding: 32px 24px 8px; max-width: 1180px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .layout {
    max-width: 1180px; margin: 0 auto; padding: 24px 24px 48px;
    display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: start;
  }

  /* ---------- course index ---------- */
  .index { position: sticky; top: 16px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .search {
    width: 100%; font: inherit; font-size: 14px; padding: 10px 14px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--surface); color: var(--ink);
  }
  .search:focus { outline: none; border-color: var(--accent); background: var(--bg); }
  .search::placeholder { color: var(--muted); }
  .lines { margin-top: 16px; overflow-y: auto; padding-right: 4px; }
  .line-group { margin: 0 0 18px; }
  .line-group h2 {
    margin: 0 0 4px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); display: flex; align-items: center; gap: 8px;
  }
  .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .stops { list-style: none; margin: 0; padding: 0; }
  .stops button {
    all: unset; box-sizing: border-box; display: flex; gap: 10px; width: 100%; padding: 6px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; line-height: 1.35;
  }
  .stops button:hover { background: var(--surface); }
  .stops button:focus-visible { outline: 2px solid var(--accent); }
  .stops button[aria-current="true"] { background: color-mix(in srgb, var(--c) 22%, white); }
  .stops .code { font-weight: 500; font-variant-numeric: tabular-nums; flex: none; width: 4.8em; }
  .stops .title { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty-search { color: var(--muted); font-size: 13px; }

  /* ---------- course board ---------- */
  .board { background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 32px; min-width: 0; }
  .station-code {
    margin: 0; font-weight: 600; font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1;
    letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  .station-title { margin: 8px 0 0; font-size: 17px; color: var(--muted); max-width: 44ch; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; padding: 0; list-style: none; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--c, var(--l-ext)) 20%, white); font-size: 12px;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .facts .plain { background: var(--surface); color: var(--muted); }
  .raw { margin: 12px 0 0; color: var(--muted); font-size: 12px; }

  .section-title { margin: 36px 0 14px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .route { position: relative; padding-left: 28px; }
  .route::before { content: ""; position: absolute; left: 5px; top: 10px; bottom: 14px; width: 2px; border-radius: 1px; background: var(--line); }
  .stage { position: relative; margin: 0 0 16px; }
  .stage::before {
    content: ""; position: absolute; left: -27px; top: 6px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--bg); border: 2px solid #d6d9e3;
  }
  .stage.here::before { background: var(--accent); border-color: var(--accent); }
  .stage-label { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: baseline; gap: 8px;
    padding: 6px 12px; border-radius: 10px; background: color-mix(in srgb, var(--c) 20%, white);
    font-size: 13px; line-height: 1.25; max-width: 100%;
  }
  .chip:hover { background: color-mix(in srgb, var(--c) 32%, white); }
  .chip:focus-visible { outline: 2px solid var(--accent); }
  .chip b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .chip span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 24ch; }
  .chip[data-external="true"] { cursor: default; background: var(--bg); border: 1px dashed #d6d9e3; }
  .note { color: var(--muted); font-size: 13px; margin: 0; }

  .bottlenecks { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line); }
  .bottlenecks ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .bottlenecks li { display: grid; grid-template-columns: 2.4em 1fr; align-items: center; gap: 10px; }
  .bottlenecks .bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--c) 60%, white); }
  .bottlenecks .count { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; }
  .bottlenecks .who { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .bottlenecks .who button { all: unset; cursor: pointer; font-weight: 500; color: var(--ink); }
  .bottlenecks .who button:focus-visible { outline: 2px solid var(--accent); }

  footer { max-width: 1180px; margin: 0 auto; padding: 0 24px 32px; color: var(--muted); font-size: 12px; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .board { order: -1; padding: 22px 18px; }
    .index { position: static; max-height: none; }
    .lines { max-height: 40vh; }
    header { padding: 22px 16px 4px; }
    .layout { padding: 16px 16px 40px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .board.arrive .station-code { animation: arrive .3s ease-out; }
    @keyframes arrive { from { transform: translateY(4px); opacity: .3; } to { transform: none; opacity: 1; } }
  }
</style>

</head>
<body>
<header>
  <h1>Course <span>Routes</span></h1>
  <p>BSc Computer Science · prerequisites and what each course unlocks</p>
</header>

<div class="layout">
  <nav class="index" aria-label="All courses">
    <label for="q" class="visually-hidden" style="position:absolute;left:-9999px">Search courses</label>
    <input id="q" class="search" type="search" placeholder="Search a course" autocomplete="off">
    <div class="lines" id="lines"></div>
  </nav>

  <main class="board" id="board" aria-live="polite">
    <p class="note">Loading the course graph…</p>
  </main>
</div>

<footer>
  Dashed: prerequisite outside the program.
</footer>

<script>
const TRACKS = {
  "Computer Science": "--l-cs", "Mathematics": "--l-math", "Science & Engineering": "--l-sci",
  "General Education": "--l-gened", "Electives": "--l-elec", "Minor": "--l-minor",
  "AI": "--l-ai", "Big Data Analytics": "--l-bda", "Software Engineering": "--l-se",
  "Computer Systems": "--l-csys", "Advanced Computer Science": "--l-acs",
};
const TRACK_ORDER = ["Computer Science", "AI", "Big Data Analytics", "Software Engineering", "Computer Systems",
  "Advanced Computer Science", "Mathematics", "Science & Engineering", "Electives", "General Education", "Minor"];

let courses = new Map(), requires = new Map(), unlocks = new Map(), current = null;

const color = code => {
  const c = courses.get(code);
  if (!c || c.external || !c.groups.length) return "var(--l-ext)";
  const spec = c.groups.find(g => g.specialization);
  return `var(${TRACKS[(spec || c.groups[0]).group] || "--l-ext"})`;
};
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function chip(code) {
  const c = courses.get(code) || { code, title: "", external: true };
  const ext = c.external ? "true" : "false";
  return `<button class="chip" style="--c:${color(code)}" data-code="${esc(code)}" data-external="${ext}"
            ${c.external ? 'aria-disabled="true" title="Named as a prerequisite, not listed as a course of this program"' : ""}>
            <b>${esc(code)}</b>${c.title ? `<span>${esc(c.title)}</span>` : ""}</button>`;
}

/* Longest-path depth of every prerequisite, so the route reads in the order courses must be taken. */
function ancestorsByDepth(code) {
  const depth = new Map();
  const visit = (node, d, path) => {
    for (const pre of requires.get(node) || []) {
      if (path.has(pre)) continue; // guard against cycles in extracted data
      if ((depth.get(pre) || 0) < d) depth.set(pre, d);
      path.add(pre); visit(pre, d + 1, path); path.delete(pre);
    }
  };
  visit(code, 1, new Set([code]));
  const stages = [];
  for (const [c, d] of depth) (stages[d] ||= []).push(c);
  return stages.slice(1).map(s => s.sort()).reverse(); // furthest first
}

function descendants(code) {
  const seen = new Set(), queue = [code];
  while (queue.length) for (const next of unlocks.get(queue.shift()) || []) if (!seen.has(next) && next !== code) { seen.add(next); queue.push(next); }
  return [...seen].sort();
}

function render(code, focusBoard) {
  current = code;
  const c = courses.get(code);
  const stages = ancestorsByDepth(code);
  const direct = [...(unlocks.get(code) || [])].sort();
  const later = descendants(code).filter(x => !direct.includes(x));
  const total = stages.reduce((n, s) => n + s.length, 0);

  const facts = [
    ...c.groups.map(g => `<li class="badge" style="--c:var(${TRACKS[g.group]})"><span class="dot"></span>${esc(g.group)}${g.role && g.role !== g.group ? `, ${esc(g.role.toLowerCase())}` : ""}</li>`),
    c.credits ? `<li class="badge plain">${c.credits} credits</li>` : "",
  ].join("");

  const route = total
    ? `<div class="route">${stages.map((s, i) => `
        <div class="stage"><p class="stage-label">Step ${i + 1}</p>
        <div class="chips">${s.map(chip).join("")}</div></div>`).join("")}
        <div class="stage here"><p class="stage-label">This course</p><div class="chips">${chip(code)}</div></div></div>`
    : `<p class="note">No prerequisites.</p>`;

  const opens = direct.length
    ? `<div class="chips">${direct.map(chip).join("")}</div>${later.length ? `<p class="stage-label" style="margin-top:12px">Later</p><div class="chips">${later.map(chip).join("")}</div>` : ""}`
    : `<p class="note">Nothing.</p>`;

  const board = document.getElementById("board");
  board.innerHTML = `
    <h2 class="station-code">${esc(code)}</h2>
    <p class="station-title">${esc(c.title || "Untitled course")}</p>
    <ul class="facts">${facts}</ul>
    ${c.prereqText ? `<p class="raw">Catalog: ${esc(c.prereqText)}</p>` : ""}
    <h3 class="section-title">Route${total ? ` · ${total} course${total > 1 ? "s" : ""} first` : ""}</h3>
    ${route}
    <h3 class="section-title">Unlocks</h3>
    ${opens}
    ${bottlenecksHtml()}`;
  board.classList.remove("arrive"); void board.offsetWidth; board.classList.add("arrive");

  document.querySelectorAll(".stops button").forEach(b => b.setAttribute("aria-current", b.dataset.code === code ? "true" : "false"));
  if (location.hash.slice(1) !== code) history.replaceState(null, "", "#" + code);
  if (focusBoard) board.querySelector(".station-code").focus?.();
}

function bottlenecksHtml() {
  const counts = [...courses.keys()].filter(k => !courses.get(k).external)
    .map(k => [k, descendants(k).length]).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 6);
  if (!counts.length) return "";
  const max = counts[0][1];
  return `<section class="bottlenecks"><h3 class="section-title" style="margin-top:0">Bottlenecks · courses that unlock the most</h3>
    <ol>${counts.map(([k, n]) => `<li><span class="count">${n}</span><div>
      <div class="bar" style="--c:${color(k)};width:${Math.max(8, 100 * n / max)}%"></div>
      <div class="who"><button data-code="${esc(k)}">${esc(k)}</button> ${esc(courses.get(k).title)}</div></div></li>`).join("")}</ol></section>`;
}

function renderIndex(filter = "") {
  const f = filter.trim().toLowerCase();
  const byTrack = new Map(TRACK_ORDER.map(t => [t, []]));
  for (const c of courses.values()) {
    if (c.external) continue;
    if (f && !(c.code.toLowerCase().includes(f) || c.title.toLowerCase().includes(f))) continue;
    for (const g of c.groups) byTrack.get(g.group)?.push(c);
  }
  const html = [...byTrack].filter(([, list]) => list.length).map(([track, list]) => `
    <section class="line-group" style="--c:var(${TRACKS[track]})">
      <h2><span class="swatch" style="background:var(${TRACKS[track]})"></span>${esc(track)}</h2>
      <ul class="stops">${list.sort((a, b) => a.code.localeCompare(b.code)).map(c => `
        <li><button data-code="${esc(c.code)}" aria-current="${c.code === current}"><span class="code">${esc(c.code)}</span><span class="title">${esc(c.title || "")}</span></button></li>`).join("")}</ul>
    </section>`).join("");
  document.getElementById("lines").innerHTML = html || `<p class="empty-search">No course matches "${esc(filter)}". Try a course number like 3309.</p>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-code]");
  if (!b || b.dataset.external === "true") return;
  render(b.dataset.code, b.closest(".index") === null);
  if (b.closest(".index") === null) window.scrollTo({ top: document.getElementById("board").offsetTop - 12, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});
document.getElementById("q").addEventListener("input", e => renderIndex(e.target.value));
window.addEventListener("hashchange", () => { const k = location.hash.slice(1).toUpperCase(); if (courses.has(k) && !courses.get(k).external && k !== current) render(k); });

fetch("data.json").then(r => r.json()).then(data => {
  for (const c of data.courses) courses.set(c.code, c);
  for (const { course, requires: pre } of data.edges) {
    (requires.get(course) || requires.set(course, new Set()).get(course)).add(pre);
    (unlocks.get(pre) || unlocks.set(pre, new Set()).get(pre)).add(course);
  }
  const fromHash = location.hash.slice(1).toUpperCase();
  const start = courses.has(fromHash) && !courses.get(fromHash).external ? fromHash : "CSC4352";
  renderIndex();
  render(courses.has(start) ? start : [...courses.keys()][0]);
}).catch(() => {
  document.getElementById("board").innerHTML = `<p class="note">The course data didn't load. Refresh the page; if it keeps failing, data.json is missing from the deployment.</p>`;
});
</script>
</body>
</html>
